name: Build NKCrane

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Test fail-closed launch capsule parser (host)
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -O2 \
            NKCraneCore/NKCLaunchCapsule.c tests/test_launch_capsule.c \
            -o /tmp/test_nkc_launch_capsule
          /tmp/test_nkc_launch_capsule
          ! grep -nE 'removeItemAtPath:\[path stringByDeletingLastPathComponent\]|removeItemAtPath:containerDir' NKCraneCore/NKCStore.m

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Verify v1.4.1 safe runtime package
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -name '*.deb' -type f | head -n 1)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Version)" = "1.4.1"

          ROOT="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$ROOT"
          DYLIB="$(find "$ROOT" -type f -name 'NKCrane.dylib' | head -n 1)"
          PROBE="$(find "$ROOT" -type f -name 'nkcraneprobe' | head -n 1)"
          test -n "$DYLIB"
          test -n "$PROBE"

          strings "$DYLIB" | grep -F '__NKCrane_Containers' >/dev/null
          strings "$DYLIB" | grep -F 'NKCRANE_RUNTIME_VERSION' >/dev/null
          strings "$DYLIB" | grep -F 'CFFIXED_USER_HOME' >/dev/null
          strings "$DYLIB" | grep -F 'safe-canonical-runtime-v1' >/dev/null
          strings "$DYLIB" | grep -F '[NKCrane 1.4.1] safe runtime' >/dev/null
          # Fail the package if the main app tweak returns to the legacy root.
          ! grep -F 'gMappedHome = [[[[gRealHome stringByAppendingPathComponent:@".nkcrane"]' Tweak.xm
          grep -F 'rootPathForContainerIdentifier:gContainerID' Tweak.xm
          strings "$PROBE" | grep -F 'legacy_link_status' >/dev/null
          strings "$PROBE" | grep -F 'shim_marker_source' >/dev/null

          strings "$PROBE" | grep -F 'physical_root_exists' >/dev/null
          strings "$PROBE" | grep -F 'runtime_marker_seen' >/dev/null
          strings "$PROBE" | grep -F 'legacy_points_to_physical' >/dev/null

          echo "Verified NKCrane v1.4.1 safe runtime payload: $DEB"

      - name: Build Sileo repository metadata
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev

          rm -rf sileo-repo
          mkdir -p sileo-repo/debs
          cp packages/*.deb sileo-repo/debs/

          cd sileo-repo
          dpkg-scanpackages --multiversion debs /dev/null > Packages

          PACKAGES_MD5=$(md5sum Packages | awk '{print $1}')
          PACKAGES_SIZE=$(stat -c%s Packages)
          PACKAGES_SHA256=$(sha256sum Packages | awk '{print $1}')

          cat > Release <<EOF
          Origin: NKTouch
          Label: NKCrane
          Suite: stable
          Version: 1.4.1
          Codename: nkcrane
          Architectures: iphoneos-arm64
          Components: main
          Description: NKCrane rootless repository for Sileo/Zebra
          Date: $(LC_ALL=C date -Ru)
          MD5Sum:
           $PACKAGES_MD5 $PACKAGES_SIZE Packages
          SHA256:
           $PACKAGES_SHA256 $PACKAGES_SIZE Packages
          EOF

          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NKCrane Repo</title></head>
          <body style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:720px;margin:40px auto;padding:0 20px">
            <h1>NKCrane Repository</h1>
            <p>Rootless packages for Sileo/Zebra.</p>
            <p>Package: <strong>NKCrane</strong></p>
          </body>
          </html>
          EOF

      - name: Publish Sileo repository to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./sileo-repo
          force_orphan: true
          enable_jekyll: false
          commit_message: "Publish NKCrane Sileo repo ${GITHUB_SHA}"

      - name: List packages
        run: ls -lah packages || true

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: NKCrane-rootless
          path: packages/*.deb
          if-no-files-found: error
