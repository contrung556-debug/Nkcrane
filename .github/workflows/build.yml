name: Build NKCrane

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Verify v1.3.1 runtime package
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -name '*.deb' -type f | head -n 1)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Version)" = "1.3.1"

          ROOT="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$ROOT"
          DYLIB="$(find "$ROOT" -type f -name 'NKCrane.dylib' | head -n 1)"
          PROBE="$(find "$ROOT" -type f -name 'nkcraneprobe' | head -n 1)"
          test -n "$DYLIB"
          test -n "$PROBE"

          strings "$DYLIB" | grep -F '__NKCrane_Containers' >/dev/null
          strings "$DYLIB" | grep -F 'NKCRANE_RUNTIME_VERSION' >/dev/null
          strings "$DYLIB" | grep -F 'CFFIXED_USER_HOME' >/dev/null
          strings "$DYLIB" | grep -F 'low_level_filesystem_hooks' >/dev/null
          strings "$DYLIB" | grep -F '[NKCrane 1.3.1] filesystem runtime' >/dev/null

          strings "$PROBE" | grep -F 'physical_root_exists' >/dev/null
          strings "$PROBE" | grep -F 'runtime_marker_seen' >/dev/null
          strings "$PROBE" | grep -F 'legacy_points_to_physical' >/dev/null

          echo "Verified NKCrane v1.3.1 runtime payload: $DEB"

      - name: List packages
        run: ls -lah packages || true

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: NKCrane-rootless
          path: packages/*.deb
          if-no-files-found: error
